services:
  bioanalyzer-package:
    build: .
    image: bioanalyzer-package
    container_name: bioanalyzer-package
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    environment:
      UVICORN_RELOAD: "false"
      LOG_LEVEL: "info"
      # Condition embedding model (SapBERT, ~440MB) downloads once into the
      # bind-mounted ./cache instead of on every container recreate.
      HF_HOME: "/app/cache/huggingface"
      # Benchmarking only: point at a held-out vocabulary built with
      # scripts/build_bugsigdb_condition_vocabulary.py --exclude-pmids.
      # Empty = the shipped app/normalization/data vocabulary.
      BUGSIGDB_CONDITION_VOCAB_PATH: "${BUGSIGDB_CONDITION_VOCAB_PATH:-}"
      # Set to 0 to skip the LLM's pick among Condition candidates (one
      # extra short LLM call for papers whose condition isn't yet a
      # BugSigDB term - see condition_disambiguation.py).
      CONDITION_LLM_DISAMBIGUATION: "${CONDITION_LLM_DISAMBIGUATION:-1}"
      # Set to 0 to skip SapBERT nearest-term matching for Condition
      # (app/normalization/embedding_match.py).
      CONDITION_EMBEDDING_MATCH: "${CONDITION_EMBEDDING_MATCH:-1}"
      # SapBERT weights for Condition matching. Defaults to the local copy
      # of cambridgeltl/SapBERT-from-PubMedBERT-fulltext under the
      # bind-mounted ./cache (cache/models/sapbert on the host), so the
      # container never needs Hugging Face at runtime. Set to the Hub id
      # to download instead.
      CONDITION_EMBEDDING_MODEL: "${CONDITION_EMBEDDING_MODEL:-/app/cache/models/sapbert}"
      # Deterministic extraction: greedy sampling, fixed seed where the
      # provider accepts one (see app/models/llm_provider.py).
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0}"
      LLM_SEED: "${LLM_SEED:-0}"
    ports:
      - "8000:8000"
    volumes:
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./results:/app/results
      - ./models:/app/models
      - ./ontology_store:/app/ontology_store
      - ./tests:/app/tests
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    networks:
      - bioanalyzer-net

  # Not used by the application today (rate limiting/caching are in-memory
  # and SQLite-backed respectively — see app/api/middleware/rate_limit.py
  # and app/services/cache_manager.py). Provisioned for future production
  # use only; the app service does not depend on it to start.
  redis:
    image: redis:7-alpine
    container_name: bioanalyzer-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bioanalyzer-net

volumes:
  redis-data:

networks:
  bioanalyzer-net:
