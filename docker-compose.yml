services:
  bioanalyzer-backend:
    build: .
    container_name: bioanalyzer-backend
    env_file:
      - .env
    environment:
      UVICORN_RELOAD: "false"
      LOG_LEVEL: "info"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./results:/app/results
      - ./tests:/app/tests
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - bioanalyzer-net

  redis:
    image: redis:7-alpine
    container_name: bioanalyzer-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bioanalyzer-net

volumes:
  redis-data:

networks:
  bioanalyzer-net:
