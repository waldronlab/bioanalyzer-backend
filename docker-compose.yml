services:
  bioanalyzer-package:
    build: .
    image: bioanalyzer-package
    container_name: bioanalyzer-package
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    environment:
      UVICORN_RELOAD: "false"
      LOG_LEVEL: "info"
    ports:
      - "8000:8000"
    volumes:
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./results:/app/results
      - ./models:/app/models
      - ./ontology_store:/app/ontology_store
      - ./tests:/app/tests
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    networks:
      - bioanalyzer-net

  # Not used by the application today (rate limiting/caching are in-memory
  # and SQLite-backed respectively — see app/api/middleware/rate_limit.py
  # and app/services/cache_manager.py). Provisioned for future production
  # use only; the app service does not depend on it to start.
  redis:
    image: redis:7-alpine
    container_name: bioanalyzer-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bioanalyzer-net

volumes:
  redis-data:

networks:
  bioanalyzer-net:
