[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
strict_optional = True

# Allow untyped calls for third-party libraries (applies to all modules,
# including paperqa/google.generativeai/litellm/requests/fastapi/uvicorn -
# no per-module override needed since this is already blanket-applied)
ignore_missing_imports = True

