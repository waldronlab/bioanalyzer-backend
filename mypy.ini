[mypy]
# Python version
python_version = 3.11

# Platform
platform = linux

# Follow imports
follow_imports = normal

# Ignore missing imports (useful for third-party packages)
ignore_missing_imports = True

# Don't require type annotations for all functions
no_implicit_optional = False

# Allow untyped definitions
allow_untyped_defs = True

# Allow untyped calls
allow_untyped_calls = True

# Show error codes
show_error_codes = True

# Show column numbers
show_column_numbers = True

# Show error context
show_error_context = True

# Color output
color_output = True

# Pretty output
pretty = True

# Warn about unused ignores
warn_unused_ignores = True

# Warn about redundant casts
warn_redundant_casts = True

# Warn about unused configs
warn_unused_configs = True

# Check untyped definitions
check_untyped_defs = False

# Disallow untyped decorators
disallow_untyped_decorators = False

# Disallow incomplete stubs
disallow_incomplete_defs = False

# Disallow untyped calls
disallow_untyped_calls = False

# Disallow any untyped
disallow_any_unimported = False

# Disallow any generic
disallow_subclassing_any = False

# Disallow untyped generics
disallow_untyped_generics = False

# Disallow any decorators
disallow_any_decorated = False

# Disallow any explicit
disallow_any_explicit = False

# Disallow any generics
disallow_any_generics = False

# Warn about return any
warn_return_any = False

# Warn about unused coroutines
warn_unused_coroutines = False

# Warn about no return
warn_no_return = False

# Warn about redundant exceptions
warn_redundant_expr = False

# Warn about unreachable
warn_unreachable = False

# Strict optional
strict_optional = False

# Strict equality
strict_equality = False

# Namespace packages
namespace_packages = True

# Explicit package bases
explicit_package_bases = False

# Files to check
files = app/

# Exclude patterns
exclude = (?x)^(tests/|scripts/|build/|dist/|\.venv/|venv/|env/|\.env/|__pycache__|\.pyc|\.pyo|\.pyd|setup\.py|conftest\.py)

# Per-module options
[mypy-tests.*]
ignore_errors = True

[mypy-scripts.*]
ignore_errors = True

# Third-party library stubs
[mypy-requests.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

