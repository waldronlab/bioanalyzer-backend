[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioanalyzer-backend"
version = "1.0.0"
description = "AI-powered tool for analyzing scientific papers for BugSigDB curation readiness"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [
    { name = "BioAnalyzer Team", email = "team@bioanalyzer.org" }
]

dependencies = [
    # Core scientific stack
    "numpy>=1.26.0",
    "pandas>=2.1.1",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # PyTorch (CPU enforced in Docker)
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",

    # Bio / NLP
    "transformers>=4.34.0",
    "biopython>=1.81",
    "sentencepiece>=0.1.99",
    "accelerate>=0.24.0",
    "datasets>=2.14.0",
    "tiktoken>=0.5.0",
    "litellm>=1.50.0",
    "paper-qa>=4.9.0",

    # Web & API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.2",
    "requests>=2.31.0",
    "aiohttp>=3.8.6",

    # Utilities
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "click>=8.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
bioanalyzer = "cli:main"

[tool.setuptools]
packages = { find = {} }
include-package-data = true
