# Dependabot configuration as backup/alternative to Renovate
# Note: Renovate is the primary tool, but Dependabot provides additional security scanning

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/config"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "RonaldRonnie"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    groups:
      security-updates:
        dependency-type: "security"
        update-types:
          - "security"
      minor-patch-updates:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "torch*"
          - "transformers"
          - "google-generativeai"
          - "litellm"
          - "paper-qa"
  
  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "RonaldRonnie"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
  
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "RonaldRonnie"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

