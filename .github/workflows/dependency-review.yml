# Dependency Review — comments on PRs when lock/dependency files change.
# Fails on high/critical vulnerabilities in new dependencies.

name: Dependency Review

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "config/requirements.txt"
      - "pyproject.toml"
      - "**/requirements*.txt"
      - "setup.py"
      - "setup.cfg"

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
