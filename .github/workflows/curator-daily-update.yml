# Daily: search PubMed for new likely-curatable papers, analyze them with
# BioAnalyzer, and commit the curator-desk CSV to data/curator_predictions.csv.
# data/curator_analyzed_pmids.json records analyzed PMIDs so each run only
# pays for new papers; new rows are merged into the CSV by PMID.
#
# Needs repo secrets GEMINI_API_KEY and NCBI_API_KEY (and ideally
# BIOANALYZER_EMAIL for NCBI). Without them the job is skipped.
# The curator-desk site (waldronlab/curator-desk) reads this CSV from main;
# notify-curator-desk.yml rebuilds that site after each successful run.
name: Curator Desk daily update

on:
  schedule:
    # 03:00 UTC, before curator-desk's 04:00 UTC site build.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      max_results:
        description: Max PubMed PMIDs to fetch
        required: false
        default: "50"

permissions:
  contents: write

# Never run two updates at once: both would commit the same files.
concurrency:
  group: curator-daily-update
  cancel-in-progress: false

jobs:
  # `secrets` can't be used in `if:` (GitHub rejects the whole workflow), so
  # check them in a step and skip the real job when they aren't configured.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ] && [ -n "$NCBI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY / NCBI_API_KEY not set; skipping the daily update."
          fi

  analyze-and-publish:
    needs: check-secrets
    if: ${{ needs.check-secrets.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      EMAIL: ${{ secrets.BIOANALYZER_EMAIL }}
      BIOANALYZER_API_URL: http://127.0.0.1:8000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Run the API straight on the runner (same as CI's test job). The Docker
      # Compose setup needs a .env file CI doesn't have, and would install
      # everything a second time inside the image.
      - name: Start BioAnalyzer API
        run: |
          nohup python scripts/main.py --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          timeout 300 bash -c 'until curl -sf http://127.0.0.1:8000/health > /dev/null; do sleep 3; done'

      - name: Run curator pipeline
        env:
          MAX_RESULTS: ${{ github.event.inputs.max_results || '50' }}
        run: |
          python scripts/curator_daily_pipeline.py \
            --max-results "$MAX_RESULTS" \
            -o data/curator_predictions.csv \
            --state-file data/curator_analyzed_pmids.json

      - name: Show API log
        if: failure()
        run: tail -n 200 api.log || true

      - name: Commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/curator_predictions.csv data/curator_analyzed_pmids.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No new predictions."
            exit 0
          fi
          git commit -m "chore: daily curator predictions update"
          # main may have moved while this job ran.
          git pull --rebase
          git push
